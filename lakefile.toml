name = "Rewrite"
defaultTargets = ["Rewrite"]

[[require]]
name = "mathlib"
path = "mathlib4"

[[lean_lib]]
name = "Rewrite"
srcDir = "src"
globs = ["Rules.+", "Examples.+", "Profunctor", "DoubleCategory.+", "Displayed.+", "DoubleDisplayed.+"]
leanOptions = { pp.unicode.fun = true, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true, maxSynthPendingDepth = 3 }
