name = "ShrewLib"
defaultTargets = ["ShrewLib"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "ShrewLib"
srcDir = "shrewlib"
globs = ["Rules.+", "Examples.+", "Logic.+", "CategoryTheory.+", "Profunctor", "TwoCategory.+", "DoubleCategory.+", "Displayed.+", "ComprehensionCategory.+", "DoubleDisplayed.+", "Tactic.+"]
leanOptions = { pp.unicode.fun = true, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true, maxSynthPendingDepth = 3 }
